{# All site styles. Colours are the variables at the top. #}
<style>
/* ==========================================================================
   Yann | Portfolio
   Claude-inspired warm palette (clay / cream / ink) + a Stark-style HUD.
   ========================================================================== */

:root {
    /* Brand */
    --clay: #D97757;          /* Claude's signature orange */
    --clay-deep: #C15F3C;
    --clay-soft: rgba(217, 119, 87, 0.14);
    --gold: #E8B464;          /* Iron Man gold, warmed up */
    --core: #FAF9F5;          /* arc reactor white-hot */
    --glow: rgba(217, 119, 87, 0.45);

    /* Dark (default) */
    --bg: #141413;
    --bg-2: #1A1918;
    --surface: #1F1E1D;
    --surface-2: #262624;
    --line: #34332F;
    --line-strong: #4A4843;
    --text: #F0EEE6;
    --text-2: #C2C0B6;
    --muted: #8F8D85;
    --grid-line: rgba(240, 238, 230, 0.035);

    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 20px 40px -24px rgba(0, 0, 0, 0.6);
    --ease: cubic-bezier(.2, .7, .2, 1);
    color-scheme: dark;
}

/* ---------- Base ---------- */

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background-color .3s, color .3s;
}

.hud-grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 70% 0%, #000 0%, transparent 70%);
}

img, video { max-width: 100%; display: block; }

a { color: var(--clay); text-decoration: none; }
a:hover { color: var(--gold); }

h1, h2, h3 {
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 .5em;
}
h1 { font-size: clamp(2.4rem, 6vw, 4rem); }
h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); }
h3 { font-size: 1.3rem; }

p { color: var(--text-2); margin: 0 0 1em; }
strong { color: var(--text); }

[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); }
.accent { color: var(--clay); }
.sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 4px; }

.container { width: min(1120px, 100% - 32px); margin-inline: auto; }

main { min-height: 60vh; }

.section { padding: 72px 0 0; }
.section-tight { padding: 24px 0 0; }
.section-head { max-width: 640px; margin-bottom: 32px; }
.section-cta { margin-top: 28px; }

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--clay);
    margin: 0 0 12px;
}

.lead { font-size: 1.15rem; max-width: 620px; }

.status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--clay);
    box-shadow: 0 0 0 0 var(--glow);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--glow); }
    70% { box-shadow: 0 0 0 8px rgba(217, 119, 87, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0); }
}

/* ---------- Buttons & links ---------- */

.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 999px;
    font: 600 .95rem var(--font-body);
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .2s var(--ease), box-shadow .2s, background .2s, color .2s;
}
.btn-primary { background: var(--clay); color: #141413; }
.btn-primary:hover { background: var(--clay-deep); color: #FAF9F5; transform: translateY(-2px); box-shadow: 0 10px 30px -10px var(--glow); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
.btn-ghost:hover { border-color: var(--clay); color: var(--clay); }
.btn-sm { padding: 7px 14px; font-size: .85rem; }

.link-arrow { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.link-arrow::after { content: "\2192"; transition: transform .2s var(--ease); }
.link-arrow:hover::after { transform: translateX(4px); }

/* ---------- Header / nav ---------- */

.site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
}

.brand { color: var(--text); display: flex; }
.brand:hover { color: var(--text); }

.logo { height: 40px; width: auto; overflow: visible; }
.lg-ring { fill: none; stroke: var(--clay); }
.lg-coil { fill: none; stroke: var(--clay); stroke-opacity: .55; transform-origin: 32px 32px; }
.lg-tri { fill: var(--gold); fill-opacity: .14; stroke: var(--gold); }
.lg-y { stroke: var(--core); }
.lg-dot { fill: var(--core); }
.logo-mark { filter: drop-shadow(0 0 6px var(--glow)); }
.brand:hover .lg-coil { animation: spin 3s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.site-nav { display: flex; align-items: center; gap: 4px; }
.site-nav a {
    color: var(--text-2);
    font-weight: 500;
    font-size: .95rem;
    padding: 8px 14px;
    border-radius: 999px;
    transition: color .2s, background .2s;
}
.site-nav a:hover { color: var(--text); background: var(--surface-2); }
.site-nav a[aria-current="page"] { color: var(--clay); background: var(--clay-soft); }

.nav-toggle {
    display: none;
    width: 42px; height: 42px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
}
.nav-toggle-bar { width: 18px; height: 2px; background: var(--text); transition: transform .25s var(--ease); }
.nav-check { position: absolute; opacity: 0; pointer-events: none; }
.nav-check:checked + .nav-toggle .nav-toggle-bar:first-of-type { transform: translateY(4px) rotate(45deg); }
.nav-check:checked + .nav-toggle .nav-toggle-bar:last-of-type { transform: translateY(-4px) rotate(-45deg); }

/* ---------- Footer ---------- */

.site-footer {
    margin-top: 96px;
    border-top: 1px solid var(--line);
    background: var(--bg-2);
}
.footer-inner {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px 32px;
    align-items: center;
    padding: 36px 0;
}
.footer-brand { display: flex; gap: 14px; align-items: center; }
.footer-name { font-family: var(--font-display); font-size: 1.2rem; color: var(--text); margin: 0; font-weight: 600; }
.footer-tag { margin: 0; font-size: .9rem; color: var(--muted); }
.footer-tag .mono { font-size: .8rem; }
.footer-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
.footer-links a { color: var(--text-2); font-weight: 500; }
.footer-links a:hover { color: var(--clay); }
.footer-meta {
    grid-column: 1 / -1;
    margin: 0;
    padding-top: 20px;
    border-top: 1px dashed var(--line);
    font-size: .78rem;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
}

/* ---------- Hero ---------- */

.hero {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 48px;
    align-items: center;
    padding: 72px 0 40px;
}
.hero-title { margin-bottom: 20px; }
.hero-sub { color: var(--text-2); font-size: .6em; font-weight: 500; }
.hero-sub em { color: var(--clay); font-style: italic; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }

.terminal {
    background: #0F0F0E;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
    max-width: 560px;
    box-shadow: var(--shadow);
}
.terminal-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    font-size: .75rem;
    color: #8F8D85;
    border-bottom: 1px solid #2A2927;
    background: #181816;
}
.terminal-bar span { width: 10px; height: 10px; border-radius: 50%; background: #3A3935; }
.terminal-bar span:first-child { background: var(--clay); }
.terminal-bar span:last-of-type { margin-right: 8px; }
.terminal-body {
    margin: 0;
    padding: 14px 16px;
    font: .85rem/1.7 var(--font-mono);
    color: #E9D9C4;
    white-space: pre-wrap;
    min-height: 9.6em;
}
.cursor::after {
    content: "\2588";
    color: var(--clay);
    animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Hero photo */
.hero-photo { position: relative; margin: 0; padding: 18px; }
.hero-photo::before {
    content: "";
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 65%);
    filter: blur(40px);
    z-index: -1;
}
.hero-photo-frame {
    border-radius: 24px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    border: 2px solid var(--clay);
    box-shadow: 0 0 50px -10px var(--glow), 0 30px 60px -30px rgba(0, 0, 0, .7);
}
.hero-photo-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.hero-badge {
    position: absolute;
    left: -6px;
    bottom: 40px;
    width: 72px; height: 72px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--line);
    box-shadow: 0 0 30px -6px var(--glow);
}
.hero-badge svg { width: 54px; height: 54px; }
.hero-badge .lg-coil { animation: spin 12s linear infinite; }
.hud-label {
    position: absolute;
    font-size: .7rem;
    letter-spacing: .12em;
    color: var(--muted);
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
}
.hud-tl { top: 0; right: 36px; }
.hud-br { bottom: 0; right: 0; }

/* ---------- Stats ---------- */

.stats-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    margin-top: 24px;
}
.stats-strip .stat { padding: 22px 24px; border-right: 1px solid var(--line); }
.stats-strip .stat:last-child { border-right: 0; }

.stat { display: flex; flex-direction: column; gap: 4px; }
.stat-value {
    font-family: var(--font-display);
    font-size: 2.2rem;
    font-weight: 600;
    line-height: 1;
    color: var(--text);
}
.stat-value small { font-size: .45em; color: var(--muted); margin-left: 4px; }
.stat-label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Cards & grids ---------- */

.grid { display: grid; gap: 22px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }

.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: relative;
    transition: border-color .25s, transform .25s var(--ease);
}

.project-card { overflow: hidden; display: flex; flex-direction: column; }
.project-card:hover { border-color: color-mix(in srgb, var(--clay) 60%, var(--line)); transform: translateY(-4px); }
.card-body { padding: 22px; display: flex; flex-direction: column; flex: 1; }
.card-body p { font-size: .95rem; }
.card-body .link-arrow { margin-top: auto; }

.media { position: relative; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; }
.media img, .media video { width: 100%; height: 100%; object-fit: cover; }
.media-fallback {
    display: grid;
    place-items: center;
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 50%, var(--clay-soft), transparent 60%),
        repeating-linear-gradient(45deg, transparent 0 10px, var(--grid-line) 10px 11px),
        var(--surface-2);
}
.mark-glyph {
    font-family: var(--font-display);
    font-size: 2.6rem;
    color: var(--clay);
    width: 96px; height: 96px;
    display: grid; place-items: center;
    border: 2px solid color-mix(in srgb, var(--clay) 60%, transparent);
    border-radius: 50%;
    box-shadow: 0 0 30px -6px var(--glow), inset 0 0 20px -8px var(--glow);
}

.chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .72rem;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-2);
    background: var(--surface-2);
}
.chip-status {
    position: absolute; top: 12px; left: 12px;
    background: rgba(20, 20, 19, .75);
    color: #F0EEE6;
    border-color: rgba(255, 255, 255, .12);
    backdrop-filter: blur(6px);
}
.tags { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-wrap: wrap; gap: 6px; }

.banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 40px;
    border-radius: var(--radius);
    border: 1px solid color-mix(in srgb, var(--clay) 35%, var(--line));
    background:
        radial-gradient(ellipse at 100% 0%, var(--clay-soft), transparent 60%),
        var(--surface);
}
.banner h2 { margin-bottom: .3em; }
.banner p { margin: 0; max-width: 560px; }
.banner .btn { flex-shrink: 0; }

/* ---------- Page heads ---------- */

.page-head { padding: 64px 0 24px; }

/* ---------- About ---------- */

.story { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }
.spec-sheet { padding: 26px; }
.spec-sheet dl { margin: 0; }
.spec-sheet dl > div {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
}
.spec-sheet dl > div:last-child { border-bottom: 0; }
.spec-sheet dt { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.spec-sheet dd { margin: 0; text-align: right; font-weight: 500; }

.feature { padding: 26px; }
.feature-icon {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--clay-soft);
    color: var(--clay);
    font-weight: 600;
    margin-bottom: 16px;
}
.feature p { font-size: .95rem; margin: 0; }
.also { margin-top: 22px; color: var(--muted); font-size: .85rem; }

.strava-panel { padding: 26px; margin-bottom: 22px; }
.strava-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.strava-head .eyebrow { margin: 0; }
.strava-head .eyebrow .status-dot { background: #FC4C02; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stats-grid .stat { padding: 16px; border-radius: var(--radius-sm); background: var(--surface-2); }

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}
.gallery-item { margin: 0; }
.gallery-item .media { border-radius: var(--radius-sm); border: 1px solid var(--line); aspect-ratio: 4 / 5; }
.gallery-item figcaption { font-size: .75rem; color: var(--muted); margin-top: 8px; text-transform: uppercase; letter-spacing: .08em; }

/* ---------- Contact ---------- */

.contact-card { padding: 26px; color: var(--text); display: flex; flex-direction: column; }
a.contact-card:hover { border-color: var(--clay); transform: translateY(-4px); color: var(--text); }
.contact-card p { font-size: .9rem; word-break: break-word; }
.contact-card .link-arrow { margin-top: auto; color: var(--clay); }

/* ---------- Games ---------- */

.games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.game { padding: 26px; display: flex; flex-direction: column; }
.game h3 { margin-bottom: .4em; }
.game > p:not(.eyebrow):not(.game-result) { font-size: .95rem; }

.age-form { display: flex; gap: 10px; margin-top: auto; }
.input {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface-2);
    color: var(--text);
    font-size: .95rem;
}
.input:focus { outline: none; border-color: var(--clay); }

.choice-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.choice {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font: 500 .9rem var(--font-body);
    cursor: pointer;
    transition: border-color .15s, background .15s;
}
.choice:hover { border-color: var(--clay); }
.choice.is-correct { border-color: #5DA06A; background: rgba(93, 160, 106, .18); }
.choice.is-wrong { border-color: #C0574A; background: rgba(192, 87, 74, .16); }

.game-result {
    margin: 14px 0 0;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border-left: 3px solid var(--gold);
    font-size: .82rem;
    color: var(--text);
}
.game-result.is-win { border-left-color: #5DA06A; }

/* ---------- Gallery ---------- */

.photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}
.photo-grid .gallery-item .media { aspect-ratio: 4 / 3; }
.photo-grid .photo-video { grid-column: span 2; grid-row: span 2; }
.photo-grid .photo-video .media { aspect-ratio: auto; height: calc(100% - 34px); min-height: 280px; }
.photo-grid figcaption {
    display: flex; align-items: center; gap: 8px;
    text-transform: none; letter-spacing: 0;
    font: .85rem var(--font-body);
    color: var(--text-2);
}

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding-top: 40px; }
    .hero-photo { max-width: 380px; width: 100%; margin: 0 auto; order: -1; }
    .photo-grid { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .story { grid-template-columns: 1fr; }
    .games { grid-template-columns: 1fr; }
    .stats-strip, .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .stats-strip .stat:nth-child(2) { border-right: 0; }
    .stats-strip .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}

@media (max-width: 700px) {
    .nav-toggle { display: flex; }
    .site-nav {
        position: absolute;
        top: 68px; left: 0; right: 0;
        flex-direction: column;
        align-items: stretch;
        padding: 12px 16px 20px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        display: none;
    }
    .nav-check:checked ~ .site-nav { display: flex; }
    .site-nav a { padding: 12px 14px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .banner { flex-direction: column; align-items: flex-start; padding: 28px; }
    .footer-inner { grid-template-columns: 1fr; }
    .photo-grid { grid-template-columns: 1fr; }
    .photo-grid .photo-video { grid-column: auto; grid-row: auto; }
    .photo-grid .photo-video .media { height: auto; aspect-ratio: 16 / 9; min-height: 0; }
    .section { padding-top: 56px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Photo layouts (About) ---------- */

.split.split-reverse { grid-template-columns: 1fr 1fr; }
.split-media.split-media-wide .media { aspect-ratio: 3 / 2; }

.gallery-2 { grid-template-columns: repeat(2, 1fr); }
.gallery-2 .gallery-item .media { aspect-ratio: 4 / 3; }

.split { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: center; }
.split-media .media { aspect-ratio: 3 / 4; }
.split-text .section-head { margin-bottom: 22px; }
.split .strava-panel { margin-bottom: 0; }
.split .stats-grid { grid-template-columns: repeat(2, 1fr); }
.telemetry-pending { margin: 0; font-size: .85rem; color: var(--muted); }

.downtime-head { margin-top: 64px; }

.chip-video {
    position: absolute; top: 12px; right: 12px;
    background: var(--clay);
    color: #141413;
    border-color: transparent;
    font-weight: 600;
}

@media (max-width: 900px) {
    .split { grid-template-columns: 1fr; }
    .split-media { max-width: 480px; }
}

@media (max-width: 560px) {
    .gallery-2 { grid-template-columns: 1fr; }
}
</style>
