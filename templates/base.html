<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Yann's portfolio{% endblock %}</title>

    <style>
        body {
            background-color: #0d1722;
            color: #e8edf4;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
        }

        header {
            background-color: #101b27;
            border-bottom: 1px solid #263746;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #50d9b0;
            margin: 0;
        }

        nav a {
            color: #e8edf4;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #50d9b0;
        }

        main {
            width: 88%;
            max-width: 1100px;
            margin: 35px auto;
            min-height: 450px;
        }

        h1, h2, h3 {
            line-height: 1.3;
        }

        h1 {
            font-size: 34px;
        }

        h2 {
            color: #50d9b0;
            font-size: 24px;
        }

        h3 {
            font-size: 18px;
        }

        p {
            color: #c5d0dd;
        }

        .highlight {
            color: #50d9b0;
        }

        .hero {
            display: flex;
            align-items: center;
            gap: 35px;
            margin-bottom: 35px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-image {
            width: 45%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        .button {
            display: inline-block;
            background-color: #50d9b0;
            color: #10201d;
            padding: 9px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
        }

        .button:hover {
            background-color: #78e8c7;
        }

        .projects {
            display: flex;
            gap: 18px;
            margin-top: 20px;
        }

        .card {
            background-color: #152331;
            border: 1px solid #263746;
            border-radius: 7px;
            overflow: hidden;
            flex: 1;
        }

        .card img {
            width: 100%;
            height: 155px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 15px;
        }

        .card h3 {
            color: #e8edf4;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 14px;
            margin-top: 5px;
        }

        .card a {
            color: #50d9b0;
            text-decoration: none;
        }

        .section-title {
            border-left: 3px solid #50d9b0;
            padding-left: 12px;
        }

        .about-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin: 15px 0;
        }

        .info-box {
            background-color: #152331;
            border: 1px solid #263746;
            padding: 20px;
            border-radius: 7px;
            margin: 20px 0;
        }

        footer {
            background-color: #101b27;
            border-top: 1px solid #263746;
            text-align: center;
            padding: 12px;
            color: #9eafc0;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero {
                flex-direction: column;
                align-items: stretch;
            }

            .hero-image {
                width: 100%;
                height: 220px;
            }

            .projects {
                flex-direction: column;
            }

            main {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>My Portfolio</h2>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}">Contact</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        My Portfolio - 2026
    </footer>

</body>
</html>
